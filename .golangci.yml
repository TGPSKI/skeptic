version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocyclo
    - funlen
  settings:
    funlen:
      lines: 200
      statements: 100
    gocyclo:
      min-complexity: 30
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - errcheck
      - path: _fuzz_test\.go
        linters:
          - funlen
