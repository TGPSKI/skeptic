name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronodex
          path: bin/chronodex
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: chronodex
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: chronodex
