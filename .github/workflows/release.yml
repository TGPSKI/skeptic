name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Dry run (skip tag push, release creation, and proxy trigger)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Authorize release actor
        env:
          ACTOR: ${{ github.actor }}
        run: |
          ALLOWED=""

          if [ -f CODEOWNERS ]; then
            ALLOWED="$ALLOWED $(grep -oP '@\K[\w-]+' CODEOWNERS | sort -u)"
          fi

          if [ -f RELEASERS ]; then
            ALLOWED="$ALLOWED $(grep -vE '^\s*(#|$)' RELEASERS | tr -s '[:space:]' ' ')"
          fi

          for user in $ALLOWED; do
            if [ "$ACTOR" = "$user" ]; then
              echo "Authorized: $ACTOR is in CODEOWNERS or RELEASERS"
              exit 0
            fi
          done

          echo "::error::$ACTOR is not authorized to create releases. Only users listed in CODEOWNERS or RELEASERS may trigger this workflow."
          exit 1

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Determine next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "current=$LATEST" >> "$GITHUB_OUTPUT"

          MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)

          case "${BUMP}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "### Version bump: $LATEST → $NEXT (${BUMP})" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify CI passed on HEAD
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          echo "Checking CI status for $HEAD_SHA..."
          CONCLUSION=$(gh run list --commit "$HEAD_SHA" --workflow ci.yml --json conclusion --jq '.[0].conclusion // "none"')
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI has not passed on HEAD ($HEAD_SHA). Latest conclusion: $CONCLUSION"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify CHANGELOG has entry for next version
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          if ! grep -q "## $NEXT" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not contain an entry for $NEXT. Add the changelog entry before releasing."
            exit 1
          fi

      - name: Build and test
        run: |
          make build
          make test-race

      - name: Build release archives
        id: dist
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          mkdir -p dist
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          GOVERS="$(go version | awk '{print $3}')"
          LDFLAGS="-s -w -X main.buildCommit=${COMMIT} -X main.buildDate=${DATE} -X main.buildGoVersion=${GOVERS}"

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            BIN="skeptic"; [ "$GOOS" = "windows" ] && BIN="skeptic.exe"
            STAGE="dist/skeptic_${NEXT}_${GOOS}_${GOARCH}"
            mkdir -p "$STAGE"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "${LDFLAGS}" -o "${STAGE}/${BIN}" ./cmd/skeptic
            cp LICENSE README.md "$STAGE/"
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -qr "$(basename "$STAGE").zip" "$(basename "$STAGE")")
            else
              tar -czf "${STAGE}.tar.gz" -C dist "$(basename "$STAGE")"
            fi
            rm -rf "$STAGE"
          done

          (cd dist && sha256sum ./*.tar.gz ./*.zip | sed 's|\./||' > checksums.txt)
          echo "Built archives:"
          ls -1 dist
          cat dist/checksums.txt

      - name: Extract changelog for release notes
        id: notes
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          NOTES=$(awk "/^## $NEXT/{flag=1; next} /^## v[0-9]/{flag=0} flag" CHANGELOG.md)
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "$NEXT"
          git push origin "$NEXT"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "$NEXT" \
            --title "$NEXT" \
            --notes "$RELEASE_NOTES" \
            --verify-tag \
            dist/*.tar.gz dist/*.zip dist/checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
          RELEASE_NOTES: ${{ steps.notes.outputs.body }}

      # The GitHub Action is consumed as TGPSKI/skeptic@v0, so the major tag has
      # to move to each release. The minor tag gives consumers a narrower pin.
      - name: Move major and minor tags
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          MAJOR="${NEXT%%.*}"
          MINOR="${NEXT%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in "$MAJOR" "$MINOR"; do
            git tag -fa "$tag" -m "$tag -> $NEXT"
            git push --force origin "$tag"
            echo "moved $tag -> $NEXT"
          done

      - name: Trigger Go module proxy indexing
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          MODULE=$(head -1 go.mod | awk '{print $2}')
          echo "Requesting proxy indexing for ${MODULE}@${NEXT}..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://proxy.golang.org/${MODULE}/@v/${NEXT}.info")
          echo "Proxy response: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::warning::Go module proxy returned $HTTP_CODE — indexing may be delayed"
          fi

      - name: Verify pkg.go.dev availability
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          MODULE=$(head -1 go.mod | awk '{print $2}')
          echo "Waiting for pkg.go.dev to index ${MODULE}@${NEXT}..."
          for i in 1 2 3 4 5; do
            sleep 15
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pkg.go.dev/${MODULE}@${NEXT}")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "pkg.go.dev is serving ${MODULE}@${NEXT}"
              echo "### pkg.go.dev: [${MODULE}@${NEXT}](https://pkg.go.dev/${MODULE}@${NEXT})" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::warning::pkg.go.dev has not indexed ${NEXT} yet — check manually at https://pkg.go.dev/${MODULE}@${NEXT}"

      - name: Summary
        env:
          NEXT: ${{ steps.version.outputs.next }}
          CURRENT: ${{ steps.version.outputs.current }}
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            echo "### Dry run complete" >> "$GITHUB_STEP_SUMMARY"
            echo "Would have tagged **$NEXT** (from $CURRENT, ${BUMP} bump)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Release $NEXT published" >> "$GITHUB_STEP_SUMMARY"
            echo "- Tag: [$NEXT](https://github.com/${REPO}/releases/tag/$NEXT)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Bump: $CURRENT → $NEXT (${BUMP})" >> "$GITHUB_STEP_SUMMARY"
          fi
