name: Ruleset Drift

# Rulesets are edited through the GitHub UI as often as through a PR, so a
# PR-triggered run would not notice a change until someone happened to open one.
# The schedule catches out-of-band edits; the PR trigger catches a committed
# file edited without the server being updated.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/ruleset-*.json'
      - '.github/workflows/ruleset-drift.yml'
      - 'scripts/ruleset-drift.py'

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Reading rulesets needs repo admin scope, which the default GITHUB_TOKEN
      # does not carry. RULESET_READ_TOKEN is a PAT with that scope. Without it
      # the script exits 78 and this job reports a warning, never a pass.
      - name: Compare committed rulesets against live
        env:
          GH_TOKEN: ${{ secrets.RULESET_READ_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          python3 scripts/ruleset-drift.py
          CODE=$?
          set -e
          case "$CODE" in
            0) echo "### Rulesets match" >> "$GITHUB_STEP_SUMMARY" ;;
            78)
              # Skip, not pass. The warning is the signal; failing the job on a
              # missing optional secret would make every fork's run red.
              echo "### Ruleset drift check skipped" >> "$GITHUB_STEP_SUMMARY"
              echo "No permission to read rulesets. Add a \`RULESET_READ_TOKEN\` secret with repo admin scope." >> "$GITHUB_STEP_SUMMARY"
              CODE=0
              ;;
            *)
              echo "### Ruleset drift detected" >> "$GITHUB_STEP_SUMMARY"
              echo "A committed \`.github/ruleset-*.json\` does not match the live ruleset. See the step log for the diff." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
          exit "$CODE"
