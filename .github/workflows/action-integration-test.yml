name: Action Integration Test

on:
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - '.github/workflows/action-integration-test.yml'
      - 'cmd/**'
      - 'internal/**'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  changes:
    if: >-
      github.event_name == 'push' ||
      github.event.action == 'opened' ||
      contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.filter.outputs.action }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${EVENT_NAME}" = "push" ]; then
            echo "action=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${BASE_SHA}"..."${HEAD_SHA}")
          if echo "$CHANGED" | grep -qE '^(action\.yml|cmd/|internal/|\.github/workflows/action-integration-test\.yml)'; then
            echo "action=true" >> "$GITHUB_OUTPUT"
          else
            echo "action=false" >> "$GITHUB_OUTPUT"
          fi

  test-action:
    needs: [changes]
    if: needs.changes.outputs.action == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan proof fixtures (advisory)
        id: advisory-scan
        uses: ./
        with:
          path: testdata/proof
          fail-on: none
          format: sarif
          sarif-upload: 'false'

      - name: Verify advisory scan passed
        shell: bash
        env:
          EXIT_CODE: ${{ steps.advisory-scan.outputs.exit-code }}
        run: |
          if [ "${EXIT_CODE}" != "0" ]; then
            echo "::error::Expected exit code 0 for advisory scan, got ${EXIT_CODE}"
            exit 1
          fi

      - name: Scan proof fixtures (gated)
        id: gated-scan
        uses: ./
        continue-on-error: true
        with:
          path: testdata/proof
          fail-on: low
          format: json
          sarif-upload: 'false'

      - name: Verify gated scan triggered policy failure
        shell: bash
        env:
          EXIT_CODE: ${{ steps.gated-scan.outputs.exit-code }}
        run: |
          if [ "${EXIT_CODE}" != "3" ]; then
            echo "::error::Expected exit code 3 for gated scan, got ${EXIT_CODE}"
            exit 1
          fi

      - name: Verify JSON result file exists
        shell: bash
        env:
          RESULT: ${{ steps.gated-scan.outputs.result-file }}
        run: |
          if [ ! -f "${RESULT}" ]; then
            echo "::error::Result file not found: ${RESULT}"
            exit 1
          fi
          if ! head -c 1 "${RESULT}" | grep -q '{'; then
            echo "::error::Result file does not appear to be JSON"
            exit 1
          fi

      - name: Scan clean fixture
        id: clean-scan
        uses: ./
        with:
          path: testdata/proof/clean-repo
          fail-on: low
          format: text
          sarif-upload: 'false'

      - name: Verify clean scan passed
        shell: bash
        env:
          EXIT_CODE: ${{ steps.clean-scan.outputs.exit-code }}
        run: |
          if [ "${EXIT_CODE}" != "0" ]; then
            echo "::error::Expected exit code 0 for clean scan, got ${EXIT_CODE}"
            exit 1
          fi

      # Regression test for expression injection. Inputs were interpolated
      # into the action's run: body, so a quote closed the surrounding string
      # literal and the rest ran as shell. The payload must now reach skeptic
      # as argv and be rejected as a bad flag.
      - name: Hostile input must not execute (expression injection)
        id: injection-scan
        uses: ./
        continue-on-error: true
        with:
          path: testdata/proof/clean-repo
          fail-on: none
          format: text
          sarif-upload: 'false'
          extra-args: '"; touch ${{ runner.temp }}/skeptic-injection-canary; echo "'

      - name: Verify no command executed and the flag was rejected
        shell: bash
        env:
          EXIT_CODE: ${{ steps.injection-scan.outputs.exit-code }}
        run: |
          if [ -e "${RUNNER_TEMP}/skeptic-injection-canary" ]; then
            echo "::error::Expression injection executed a command on the runner"
            exit 1
          fi
          if [ "${EXIT_CODE}" = "0" ]; then
            echo "::error::Expected skeptic to reject the injected argument, got exit code 0"
            exit 1
          fi
          echo "Injection blocked; skeptic rejected the argument with exit code ${EXIT_CODE}"

  test-action-result:
    if: always()
    needs: [changes, test-action]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.test-action.result }}" = "failure" ] || [ "${{ needs.changes.result }}" = "failure" ]; then
            exit 1
          fi
