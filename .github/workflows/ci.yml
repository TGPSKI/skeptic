name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  test:
    if: >-
      github.event_name == 'push' ||
      github.event.action == 'opened' ||
      contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write # the self-scan uploads SARIF to code scanning
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Format check and vet
        run: make check

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.1

      - name: Validate built-in rules
        run: make validate-rules

      - name: Verify rulepack signatures
        run: |
          PUBKEY=rulepacks/signing/rulepack-signing.pub.pem
          FAIL=0
          for sig in $(find rulepacks/campaigns -name '*.json.sig'); do
            pack="${sig%.sig}"
            if ! go run ./cmd/skeptic verify-rulepack --public-key "$PUBKEY" --rules-file "$pack"; then
              echo "::error::Signature verification failed: $pack"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi

      - name: Validate rulepack corpus tests
        run: make validate-rulepacks

      - name: Unit tests (race detector)
        run: make test-race

      - name: Integration tests
        run: make integration

      - name: Coverage gate
        run: make coverage-check

      - name: Benchmarks
        run: make bench-save

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: skeptic-bench-${{ matrix.os }}
          path: bench-results.txt
          retention-days: 30

      # Runs through the local composite action rather than `go run`, so
      # action.yml is exercised on every CI run and the repository is gated by
      # the same path a consumer uses. Config comes from the committed
      # .skeptic.json; see it for what is ignored and why.
      #
      # This step blocks. It previously discarded stderr and exit code with
      # `|| true`, so 487 findings and a 100/100 risk score enforced nothing
      # (#65).
      - name: Self-scan
        if: matrix.os == 'ubuntu-latest'
        uses: ./

  # Windows is a separate job rather than a third matrix entry because
  # windows-latest ships no GNU Make, so every `make` step above would need a
  # per-OS replacement. It runs only the checks whose behavior is OS-dependent:
  # `internal/corpus` file locking, path handling in `internal/scan`,
  # `internal/config`, and `internal/report`'s atomic rename. Lint, benchmarks,
  # the coverage gate, and rulepack signature verification are OS-independent
  # and stay on the matrix job.
  #
  # Integration tests remain POSIX-only for now — they build and exec the binary
  # and shell out to git, which needs separate work (#66).
  test-windows:
    if: >-
      github.event_name == 'push' ||
      github.event.action == 'opened' ||
      contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # The race detector needs cgo. windows-latest ships gcc, so this is the
      # same coverage the matrix job gets, and it is what exercises
      # LockFileEx/UnlockFileEx under contention in TestConcurrentFetchLock.
      - name: Unit tests (race detector)
        run: go test -race ./...
