name: go-skeptic
description: Scan for structural trust boundary vulnerabilities that CVE scanners, SAST tools, and secret scanners miss.
author: '@TGPSKI Tyler Pate'

branding:
  icon: crosshair
  color: purple

inputs:
  path:
    description: Root path to scan
    required: false
    default: '.'
  format:
    description: 'Output format: text|json|sarif|markdown'
    required: false
    default: 'sarif'
  mode:
    description: 'Operating mode: developer|ir|deep'
    required: false
    default: 'developer'
  preset:
    description: 'Scan preset: quick|dev|ci|hunt|machine-identity|ai-workload'
    required: false
    default: 'ci'
  fail-on:
    description: 'Severity gate: none|info|low|medium|high|critical'
    required: false
    default: 'high'
  fail-on-score:
    description: 'Risk score gate (0-100, 0 disables)'
    required: false
    default: '0'
  scan-style:
    description: 'Detection style: pattern|behavior|hybrid'
    required: false
    default: 'pattern'
  threat-mode:
    description: 'Focus area: all|machine-identity|ai-workload'
    required: false
    default: 'all'
  config:
    description: 'Path to .skeptic.* config file (empty = auto-discover)'
    required: false
    default: ''
  rules-file:
    description: Path to external rule pack JSON
    required: false
    default: ''
  rules-pubkey:
    description: Path to Ed25519 public key for rule pack signature verification
    required: false
    default: ''
  baseline:
    description: Path to prior JSON report for diff-only gating
    required: false
    default: ''
  waivers:
    description: Path to JSON waiver file
    required: false
    default: ''
  go-version:
    description: Go version for building skeptic
    required: false
    default: '1.24'
  sarif-upload:
    description: Auto-upload SARIF to GitHub code scanning (requires format=sarif)
    required: false
    default: 'true'
  extra-args:
    description: Additional CLI flags passed directly to skeptic scan
    required: false
    default: ''

outputs:
  exit-code:
    description: 'skeptic exit code: 0=pass, 1=error, 2=bad args, 3=policy failure'
    value: ${{ steps.scan.outputs.exit-code }}
  sarif-file:
    description: Path to the SARIF results file (when format=sarif)
    value: ${{ steps.scan.outputs.sarif-file }}
  result-file:
    description: Path to the results file (any format)
    value: ${{ steps.scan.outputs.result-file }}

runs:
  using: composite
  steps:
    # A release binary avoids installing Go and compiling on every job. It is
    # only attempted when the action is pinned to a version tag, because that is
    # the only case where a matching release exists. Any failure — unresolvable
    # version, missing asset, checksum mismatch — falls through to the source
    # build, so the action never breaks on a download problem.
    - name: Download release binary
      id: download
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail

        # Written exactly once, on every path, so the result never depends on
        # how duplicate GITHUB_OUTPUT keys are resolved.
        bail() { echo "found=false" >> "${GITHUB_OUTPUT}"; echo "$1"; exit 0; }

        REPO="${ACTION_REPO:-TGPSKI/skeptic}"
        case "${ACTION_REF:-}" in
          v[0-9]*.[0-9]*.[0-9]*) VERSION="${ACTION_REF}" ;;
          v[0-9]*)
            # Moving tag such as v0 or v0.3: resolve to the newest release that
            # sits under it, so v0 does not follow a future v1.
            VERSION="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${REPO}/releases?per_page=100" 2>/dev/null \
              | grep -o '"tag_name": *"[^"]*"' | sed 's/.*"\([^"]*\)"$/\1/' \
              | grep -E "^${ACTION_REF}(\.|$)" | head -1)"
            ;;
          *) VERSION="" ;;
        esac

        if [ -z "${VERSION}" ]; then
          bail "no release version resolved from ref '${ACTION_REF:-}'; building from source"
        fi

        case "${RUNNER_OS}" in
          Linux)   OS="linux" ;;
          macOS)   OS="darwin" ;;
          Windows) OS="windows" ;;
          *) bail "unsupported runner OS ${RUNNER_OS}; building from source" ;;
        esac
        case "${RUNNER_ARCH}" in
          X64)   ARCH="amd64" ;;
          ARM64) ARCH="arm64" ;;
          *) bail "unsupported runner arch ${RUNNER_ARCH}; building from source" ;;
        esac

        EXT="tar.gz"; [ "${OS}" = "windows" ] && EXT="zip"
        NAME="skeptic_${VERSION}_${OS}_${ARCH}.${EXT}"
        BASE="https://github.com/${REPO}/releases/download/${VERSION}"
        TMP="$(mktemp -d)"

        if ! curl -fsSL -o "${TMP}/${NAME}" "${BASE}/${NAME}" \
          || ! curl -fsSL -o "${TMP}/checksums.txt" "${BASE}/checksums.txt"; then
          bail "::warning::could not download ${NAME}; building from source"
        fi

        # Verify before extracting, never after.
        WANT="$(grep " ${NAME}\$" "${TMP}/checksums.txt" | awk '{print $1}')"
        if [ -z "${WANT}" ]; then
          bail "::warning::${NAME} absent from checksums.txt; building from source"
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          GOT="$(sha256sum "${TMP}/${NAME}" | awk '{print $1}')"
        else
          GOT="$(shasum -a 256 "${TMP}/${NAME}" | awk '{print $1}')"
        fi
        if [ "${WANT}" != "${GOT}" ]; then
          echo "::error::checksum mismatch for ${NAME}: expected ${WANT}, got ${GOT}"
          exit 1
        fi

        mkdir -p "${ACTION_PATH}/bin"
        if [ "${EXT}" = "zip" ]; then
          unzip -qo "${TMP}/${NAME}" -d "${TMP}/x"
        else
          mkdir -p "${TMP}/x" && tar -xzf "${TMP}/${NAME}" -C "${TMP}/x"
        fi
        BIN="$(find "${TMP}/x" -type f -name 'skeptic' -o -type f -name 'skeptic.exe' | head -1)"
        if [ -z "${BIN}" ]; then
          bail "::warning::no skeptic binary in ${NAME}; building from source"
        fi
        cp "${BIN}" "${ACTION_PATH}/bin/$(basename "${BIN}")"
        chmod +x "${ACTION_PATH}/bin/$(basename "${BIN}")"
        echo "found=true" >> "${GITHUB_OUTPUT}"
        echo "using released skeptic ${VERSION} (${OS}/${ARCH}), checksum verified"

    - name: Setup Go
      if: steps.download.outputs.found != 'true'
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: true

    - name: Build skeptic
      if: steps.download.outputs.found != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
        DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        GOVERS="$(go version | awk '{print $3}')"
        LDFLAGS="-X main.buildCommit=${COMMIT} -X main.buildDate=${DATE} -X main.buildGoVersion=${GOVERS}"
        mkdir -p bin
        go build -ldflags "${LDFLAGS}" -o bin/skeptic ./cmd/skeptic

    - name: Run skeptic scan
      id: scan
      shell: bash
      # Inputs pass through env, never into the script body. GitHub expands
      # ${{ }} before bash sees the text, so an inline ${{ inputs.X }} lets a
      # quote in any input execute commands on the runner.
      env:
        ACTION_BIN_DIR: ${{ github.action_path }}/bin
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PRESET: ${{ inputs.preset }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FAIL_ON_SCORE: ${{ inputs.fail-on-score }}
        INPUT_SCAN_STYLE: ${{ inputs.scan-style }}
        INPUT_THREAT_MODE: ${{ inputs.threat-mode }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_RULES_FILE: ${{ inputs.rules-file }}
        INPUT_RULES_PUBKEY: ${{ inputs.rules-pubkey }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_WAIVERS: ${{ inputs.waivers }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        set -uo pipefail

        # The release archive for Windows carries skeptic.exe.
        SKEPTIC_BIN="${ACTION_BIN_DIR}/skeptic"
        if [ ! -x "${SKEPTIC_BIN}" ] && [ -x "${ACTION_BIN_DIR}/skeptic.exe" ]; then
          SKEPTIC_BIN="${ACTION_BIN_DIR}/skeptic.exe"
        fi

        SUFFIX="$(date +%s)-$$"
        case "${INPUT_FORMAT}" in
          sarif)    EXT="sarif" ;;
          json)     EXT="json" ;;
          markdown) EXT="md" ;;
          *)        EXT="txt" ;;
        esac
        RESULT_FILE="${RUNNER_TEMP}/skeptic-results-${SUFFIX}.${EXT}"

        # An array, not a string: each element stays one argv entry.
        ARGS=(
          scan
          --path "${INPUT_PATH}"
          --format "${INPUT_FORMAT}"
          --mode "${INPUT_MODE}"
          --preset "${INPUT_PRESET}"
          --fail-on "${INPUT_FAIL_ON}"
          --fail-on-score "${INPUT_FAIL_ON_SCORE}"
          --scan-style "${INPUT_SCAN_STYLE}"
          --threat-mode "${INPUT_THREAT_MODE}"
          --out "${RESULT_FILE}"
        )

        # `cond && ARGS+=(...)` would abort the step under the runner's default
        # `bash -e` whenever the condition is false, so these stay if-blocks.
        if [ -n "${INPUT_CONFIG}" ]; then       ARGS+=(--config "${INPUT_CONFIG}"); fi
        if [ -n "${INPUT_RULES_FILE}" ]; then   ARGS+=(--rules-file "${INPUT_RULES_FILE}"); fi
        if [ -n "${INPUT_RULES_PUBKEY}" ]; then ARGS+=(--rules-pubkey "${INPUT_RULES_PUBKEY}"); fi
        if [ -n "${INPUT_BASELINE}" ]; then     ARGS+=(--baseline "${INPUT_BASELINE}"); fi
        if [ -n "${INPUT_WAIVERS}" ]; then      ARGS+=(--waivers "${INPUT_WAIVERS}"); fi

        # extra-args is a flag list, so it is word-split. The split happens
        # after GitHub expansion, so it yields arguments, not shell syntax.
        if [ -n "${INPUT_EXTRA_ARGS}" ]; then
          read -r -a EXTRA <<< "${INPUT_EXTRA_ARGS}"
          ARGS+=("${EXTRA[@]}")
        fi

        LOG_FILE="${RUNNER_TEMP}/skeptic-stderr-${SUFFIX}.log"
        EXIT_CODE=0
        "${SKEPTIC_BIN}" "${ARGS[@]}" 2>"${LOG_FILE}" || EXIT_CODE=$?
        if [ -s "${LOG_FILE}" ]; then
          cat "${LOG_FILE}" >&2
        fi

        echo "exit-code=${EXIT_CODE}" >> "${GITHUB_OUTPUT}"
        echo "result-file=${RESULT_FILE}" >> "${GITHUB_OUTPUT}"
        if [ "${INPUT_FORMAT}" = "sarif" ]; then
          echo "sarif-file=${RESULT_FILE}" >> "${GITHUB_OUTPUT}"
        fi

        if [ "${EXIT_CODE}" -ne 0 ] && [ "${EXIT_CODE}" -ne 3 ]; then
          echo "::error::skeptic scan failed with exit code ${EXIT_CODE}"
          exit "${EXIT_CODE}"
        fi

        if [ "${EXIT_CODE}" -eq 3 ]; then
          echo "::warning::skeptic policy failure (--fail-on threshold exceeded)"
        fi

    - name: Upload SARIF to GitHub code scanning
      if: always() && inputs.sarif-upload == 'true' && inputs.format == 'sarif' && steps.scan.outputs.sarif-file != ''
      uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        wait-for-processing: false

    - name: Upload scan results artifact
      if: always() && steps.scan.outputs.result-file != ''
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: skeptic-results-${{ inputs.format }}-${{ inputs.fail-on }}
        path: ${{ steps.scan.outputs.result-file }}
        retention-days: 30

    - name: Fail on policy violation
      if: steps.scan.outputs.exit-code == '3'
      shell: bash
      run: exit 3
